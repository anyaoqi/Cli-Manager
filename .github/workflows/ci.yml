name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'v*'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Test and Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Tests
        run: dotnet test tests/CliManager.Tests/CliManager.Tests.csproj -c Release --nologo

      - name: Build Solution
        run: dotnet build CliManager.slnx -c Release --nologo
