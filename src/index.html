<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>右键菜单管理工具</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo">≡</div>
        <div>
          <h1>右键菜单管理</h1>
          <p class="sub">查看并管理 Windows 右键菜单里的所有快捷启动方式</p>
        </div>
      </div>
      <div class="actions">
        <button id="btn-refresh" class="btn">刷新</button>
        <button id="btn-scan" class="btn">扫描已装工具</button>
        <button id="btn-add" class="btn btn-primary">+ 新增启动项</button>
        <button id="btn-restart-explorer" class="btn btn-ghost" title="菜单未刷新时重启资源管理器">重启资源管理器</button>
      </div>
    </header>

    <section class="settings">
      <div class="filter-tabs" id="location-tabs">
        <button type="button" class="tab active" data-loc="">全部</button>
        <button type="button" class="tab" data-loc="background">文件夹空白</button>
        <button type="button" class="tab" data-loc="folder">文件夹</button>
        <button type="button" class="tab" data-loc="drive">磁盘</button>
      </div>
    </section>

    <main>
      <div id="empty" class="empty hidden">
        没有找到右键菜单启动项。点击「扫描已装工具」快速添加，或「新增启动项」手动添加。
      </div>
      <ul id="item-list" class="item-list"></ul>
    </main>

    <footer class="statusbar">
      <span id="status">就绪</span>
      <span class="hint">提示：Windows 11 下菜单项位于「显示更多选项 / Shift+F10」中；本机(HKLM)项需管理员权限修改</span>
    </footer>

    <!-- 扫描已装工具弹层 -->
    <div id="scan-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <h2>扫描到的已安装工具</h2>
          <button class="x" data-close>×</button>
        </div>
        <div id="scan-body" class="modal-body"></div>
        <div class="modal-foot">
          <label class="foot-term">终端(CLI) <select id="scan-terminal"></select></label>
          <span class="muted">将添加到「文件夹空白处 + 文件夹本身」</span>
          <button class="btn" data-close>取消</button>
          <button id="scan-add" class="btn btn-primary">添加所选</button>
        </div>
      </div>
    </div>

    <!-- 新增启动项表单 -->
    <div id="edit-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <h2>新增右键启动项</h2>
          <button class="x" data-close>×</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label>显示名称</label>
            <input id="f-name" type="text" placeholder="在 XXX 中打开" />
          </div>
          <div class="field">
            <label>类型</label>
            <select id="f-kind">
              <option value="cli">CLI（在终端中运行）</option>
              <option value="gui">GUI（直接打开应用）</option>
            </select>
          </div>
          <div class="field" id="f-terminal-field">
            <label>终端 <span class="muted">（仅 CLI 类型使用）</span></label>
            <select id="f-terminal"></select>
          </div>
          <div class="field">
            <label>可执行文件</label>
            <div class="row">
              <input id="f-exe" type="text" placeholder="C:\\path\\to\\tool.exe" />
              <button id="f-browse" class="btn">浏览…</button>
            </div>
          </div>
          <div class="field">
            <label>命令模板 <span class="muted">（占位符 {exe} 与 %V＝当前目录）</span></label>
            <input id="f-template" type="text" placeholder="{exe} &quot;%V&quot;" />
          </div>
          <div class="field">
            <label>图标 <span class="muted">（留空＝用可执行文件图标，可写 path,0）</span></label>
            <input id="f-icon" type="text" placeholder="可选" />
          </div>
          <div class="field">
            <label>显示位置 <span class="muted">（至少选一个，写入当前用户 HKCU）</span></label>
            <div class="pos-group" id="item-positions">
              <label><input type="checkbox" value="background" /> 文件夹空白处</label>
              <label><input type="checkbox" value="folder" /> 右击文件夹本身</label>
              <label><input type="checkbox" value="desktop" /> 桌面空白处</label>
            </div>
          </div>
          <div class="preview">
            <span class="muted">最终命令预览：</span>
            <code id="f-preview">—</code>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn" data-close>取消</button>
          <button id="edit-save" class="btn btn-primary">创建</button>
        </div>
      </div>
    </div>

    <!-- 通用确认对话框 -->
    <div id="confirm-modal" class="modal hidden">
      <div class="modal-card confirm-card">
        <div class="modal-body">
          <p id="confirm-msg"></p>
        </div>
        <div class="modal-foot">
          <button id="confirm-cancel" class="btn">取消</button>
          <button id="confirm-ok" class="btn btn-primary">确定</button>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
